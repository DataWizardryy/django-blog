{% extends 'blog_main/layout.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row pt-5">
<!--    load sidebar here-->
    {% include 'blog_main/sidebar.html' %}
    <div class="col">
        {% if perms.auth.add_user %}
        <h3>Edit User</h3>
        <div class="container">
            <form action="{% url 'edit_user' user.id %}" method="POST">
                {% csrf_token %}
                {{ form | crispy }}

                <button class="btn btn-success" type="submit">Submit</button>

            </form>
        </div>
        {% else %}
        You do not have permission
        {% endif %}


{% endblock %}
