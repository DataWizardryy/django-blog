{% extends 'blog_main/layout.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row pt-5">
<!--    load sidebar here-->
    {% include 'blog_main/sidebar.html' %}
    <div class="col">
        <h3>Edit Category</h3>
        <div class="container">
            <form action="{% url 'edit_category' category.id %}" method="POST" style="width: 400px;">
                {% csrf_token %}
                {{ form | crispy }}

                <button class="btn btn-success" type="submit">Add</button>
            </form>
        </div>



{% endblock %}
