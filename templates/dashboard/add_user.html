{% extends 'blog_main/layout.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row pt-5">
<!--    load sidebar here-->
    {% include 'blog_main/sidebar.html' %}
    <div class="col">
        {% if perms.auth.add_user %}
        <h3>Add User</h3>
        <div class="container">
            <form action="{% url 'add_user' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form | crispy }}

                <button class="btn btn-success btn-sm" type="submit">Add</button>
                <a href="{% url 'users' %}" class="btn btn-dark btn-sm">Cancel</a>
            </form>
        </div>
        {% else %}
        You do not have permission to add user
        {% endif %}



{% endblock %}
