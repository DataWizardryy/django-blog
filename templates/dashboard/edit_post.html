{% extends 'blog_main/layout.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row pt-5">
<!--    load sidebar here-->
    {% include 'blog_main/sidebar.html' %}
    <div class="col">
        <h3>Edit Post</h3>
        <div class="container">
            <form action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form | crispy }}

                <button class="btn btn-success" type="submit">Send</button>
            </form>
        </div>



{% endblock %}
